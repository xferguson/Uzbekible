name: Auto-merge

# Policy (see .claude/skills/pr-flow/SKILL.md):
#   When CI succeeds on a pull request, squash-merge it unless it is a draft or
#   labelled `needs-approval` / `do-not-merge`. Docs-only PRs pass CI fast, so
#   they merge almost immediately; code PRs merge once their full CI is green.
#
# Note: workflow_run workflows only run from the default branch, so this takes
# effect for PRs opened after this file is on `main`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --head "$HEAD_BRANCH" --state open \
                 --json number,isDraft,headRefOid,labels --jq '.[0] // empty')
          if [ -z "$pr" ]; then echo "No open PR for $HEAD_BRANCH"; exit 0; fi

          num=$(jq -r '.number' <<<"$pr")
          draft=$(jq -r '.isDraft' <<<"$pr")
          head=$(jq -r '.headRefOid' <<<"$pr")
          labels=$(jq -r '[.labels[].name] | join(",")' <<<"$pr")
          echo "PR #$num draft=$draft head=$head labels=[$labels]"

          if [ "$head" != "$HEAD_SHA" ]; then echo "CI ran on an older commit; skipping"; exit 0; fi
          if [ "$draft" = "true" ]; then echo "Draft PR; skipping"; exit 0; fi
          case ",$labels," in
            *,needs-approval,*|*,do-not-merge,*) echo "Blocked by label; skipping"; exit 0;;
          esac

          gh pr merge "$num" -R "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          echo "Merged PR #$num"

          # GITHUB_TOKEN merges don't trigger push workflows; dispatch deploy explicitly if it exists.
          if gh api "repos/$REPO/contents/.github/workflows/deploy.yml?ref=main" >/dev/null 2>&1; then
            gh workflow run deploy.yml -R "$REPO" --ref main
            echo "Dispatched deploy"
          fi
